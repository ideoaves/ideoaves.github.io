<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>折メ思案 ( 𝐼𝑑𝑒𝑜𝑎𝑣𝑒𝑠 )</title>
  <meta name="description" content="表現をしています">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="折メ思案">
  <meta name="twitter:description" content="表現をしています">
  <meta name="twitter:image" content="https://ideoaves.github.io/img/icon.png">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <style>
    html {
      background: linear-gradient(0, #AAA 0%, #EEE 100%);
    }

    .おおきな分類 {
      padding: 0;
    }

    .アイコンと名前 {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }

    .アイコンの枠 {
      flex: 0 0 var(--名前の高さ, 200px);
      padding-bottom: 0;
    }

    .アイコン {
      width: 100%;
    }

    .名前とリンク {
      flex: 1;
      min-width: 0;
      padding-bottom: 0;
    }

    .名前とリンク h1 {
      margin-top: 0;
      line-height: 1;
    }

    .絵文字 {
      font-family: "Noto Color Emoji";
    }

    .絵文字>span {
      display: inline-block;
      border: 1px solid currentColor;
      border-radius: var(--ra);
      padding: 2px 5px;
      margin-right: 5px;
      line-height: 1.5;
    }

    @media screen and (max-width:900px) {
      .アイコンと名前 {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
      }

      .アイコンの枠 {
        flex: none;
        width: 200px;
      }

      .名前とリンク {
        width: 100%;
      }

      .リンク一覧 {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
      }

      .リンク一覧 br {
        display: none;
      }
    }
  </style>
</head>


<body>
  <header>
    <div class="ロゴ"></div>
    <div id="ヘッダー"></div>
  </header>

  <main>
    <div class="横に狭い分類">
      <div class="アイコンと名前">
        <div class="ちゅうくらいの分類 アイコンの枠">
          <a href="https://twitter.com/olime_sian">
            <img class="アイコン" alt=""
              src="https://pbs.twimg.com/profile_images/1864628493700747268/Ey5X7vQd_400x400.jpg"></a>
        </div>
        <div class="ちゅうくらいの分類 名前とリンク">
          <h1>折メ思案</h1>
          <a>Olime_Sian</a>
          <h2>リンク</h2>
          <div class="リンク一覧">
            <a href="https://twitter.com/olime_sian">Twitter</a><br>
            <a href="https://www.pixiv.net/users/75238991">Pixiv</a><br>
            <a href="https://odaibako.net/u/olime_sian">odaibako</a>
          </div>
        </div>
      </div>
      <h1 id="自己紹介">自己紹介</h1>
      <p>お絵かきをします。</p>
      <h3 id="Vtuber-">Vtuber:</h3>
      <p><a class="絵文字">
          <span class="カーソルを"><span>🎹✨</span><span>音乃瀬奏</span></span>
          <span class="カーソルを"><span>💬🔁💙</span><span>水宮枢</span></span>
          <span class="カーソルを"><span>📡</span><span>宙科そぴあ</span></span>
          <span class="カーソルを"><span>🐙</span><span>一伊那尓栖</span></span>
          <span class="カーソルを"><span>🪶</span><span>七詩ムメイ</span></span>
          <span class="カーソルを"><span>⏳</span><span>オーロ・クロニー</span></span></a><br>
        ホロライブ箱推し　特にDEV_ISとEN IDが好きです。<br>
        学術Vにもハマってます。</p>
      <h3 id="ウマ娘-">ウマ娘:</h3>
      <p>タキカフェメインです。</p>
      <h3 id="その他-">その他:</h3>
      <p>けものフレンズ・ボーカロイドなど　キャラデザや風景にも興味があります。<br>
        最近はアニメーションに興味があって　ボカロMVに参加しています。</p>
      <h2 id="利用">利用</h2>
      <p><a rel="license" href="https://creativecommons.org/licenses/by/4.0/deed.ja"><img alt="クリエイティブ・コモンズ・ライセンス"
            style="width: auto;" src="https://i.creativecommons.org/l/by/4.0/88x31.png"></a><br>
        私が趣味で制作した創作物は、CC BY 4.0になっています！</p>
    </div>
  </main>
  <script src="/JS.js"></script>
  <script>
    // 名前の上端から最後のリンクの下端までをアイコンの一辺としてCSS変数に渡す
    {
      const nameBlock = document.querySelector('.名前とリンク');
      new ResizeObserver(() => {
        const height = nameBlock.querySelector('.リンク一覧').lastElementChild.getBoundingClientRect().bottom - nameBlock.getBoundingClientRect().top;
        nameBlock.parentElement.style.setProperty('--名前の高さ', height + 'px');
      }).observe(nameBlock);
    }
  </script>
</body>

</html>
