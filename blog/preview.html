<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>blog editor ( 𝐼𝑑𝑒𝑜𝑎𝑣𝑒𝑠 )</title>
    <meta name="description" content="ブログのライブエディタ">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">

    <style>
        /* このページ専用のレイアウト。左にtxt構文のエディタ、右に本番と同じ見た目のプレビューを置くよ。 */
        body {
            max-width: 1500px;
        }

        .エディタ全体 {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .エディタ側 {
            position: sticky;
            top: 10px;
            flex: 0 0 42%;
        }

        .エディタ側 textarea {
            width: 100%;
            height: calc(100vh - 40px);
            box-sizing: border-box;
            padding: 15px;
            border: none;
            outline: 1px solid #000;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: inherit;
            line-height: 1.8;
            resize: none;
        }

        .プレビュー側 {
            flex: 1;
            min-width: 0;
            max-width: 700px;
            margin: 0 auto;
        }

        @media screen and (max-width:900px) {
            .エディタ全体 {
                flex-direction: column;
            }

            .エディタ側 {
                position: static;
                width: 100%;
                flex: none;
            }

            .エディタ側 textarea {
                height: 40vh;
            }
        }
    </style>
</head>


<body>
    <header>
        <div class="ロゴ"></div>
        <div id="ヘッダー"></div>
    </header>

    <main>
        <div class="エディタ全体">
            <div class="エディタ側">
                <textarea id="入力" spellcheck="false" placeholder="1行目はタイトル。2行目にid=著者。あとは本文。"></textarea>
            </div>

            <div class="プレビュー側">
                <div class="横に狭い分類">
                    <div id="プレビュー"></div>
                    <div class="承認欲求">
                        <div class="heart">♥<span class="乱数"></span></div>
                        <div class="up">⤴<span class="乱数"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script async src="https://platform.twitter.com/widgets.js"></script>
    <script type="module">
        /* txt記法の変換ロジックはparser.mjsが唯一の実装で、ビルド（build.mjs）も同じファイルを読むよ。
           なのでこのプレビューの表示は、本番で出力されるHTMLと必ず一致するよ。 */
        import { renderPreview } from "./parser.mjs";

        /* ここからエディタページの動作だよ。 */

        const 入力 = document.getElementById("入力");
        const プレビュー = document.getElementById("プレビュー");

        function render() {
            プレビュー.innerHTML = renderPreview(入力.value);

            // JS.jsが読み込み時にやっている「カーソルを」注釈の初期化を、再描画のたびにやり直すよ。
            プレビュー.querySelectorAll(".カーソルを").forEach(el => {
                el.setAttribute("tabindex", "0");
                const spans = el.querySelectorAll(":scope > span");
                if (spans.length > 1) {
                    spans[1].classList.add("すると出る");
                }
            });

            // Twitter埋め込みがあれば、widgets.jsに描画してもらうよ。
            if (window.twttr && window.twttr.widgets) {
                window.twttr.widgets.load(プレビュー);
            }
        }

        let timer = null;
        入力.addEventListener("input", () => {
            clearTimeout(timer);
            timer = setTimeout(render, 200);
        });

        // 閉じたり更新したりしても書きかけが消えないよう、localStorageに自動保存するよ。
        const 保存キー = "blog-preview-draft";
        入力.addEventListener("input", () => {
            localStorage.setItem(保存キー, 入力.value);
        });
        const 下書き = localStorage.getItem(保存キー);
        if (下書き) {
            入力.value = 下書き;
        }
        render();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>
    <script src="../JS.js"></script>
</body>

</html>
