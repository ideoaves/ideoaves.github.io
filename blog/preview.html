<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>blog editor ( 𝐼𝑑𝑒𝑜𝑎𝑣𝑒𝑠 )</title>
    <meta name="description" content="ブログのライブエディタ">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            max-width: 1500px;
        }

        .エディタ全体 {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .エディタ側 {
            position: sticky;
            top: 10px;
            flex: 0 0 42%;
        }

        .保存欄 {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .保存欄 input,
        .保存欄 select,
        .保存欄 button {
            padding: 5px 15px;
            border: none;
            outline: 1px solid #000;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: inherit;
        }

        .保存欄 button {
            cursor: pointer;
        }

        .保存欄 span {
            align-self: center;
            font-size: 0.8em;
            opacity: 0.6;
        }

        .エディタ側 textarea {
            width: 100%;
            height: calc(100vh - 84px);
            box-sizing: border-box;
            padding: 15px;
            border: none;
            outline: 1px solid #000;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: inherit;
            line-height: 1.8;
            resize: none;
        }

        .プレビュー側 {
            flex: 1;
            min-width: 0;
            max-width: 700px;
            margin: 0 auto;
        }

        @media screen and (max-width:900px) {
            .エディタ全体 {
                flex-direction: column;
            }

            .エディタ側 {
                position: static;
                width: 100%;
                flex: none;
            }

            .エディタ側 textarea {
                height: 40vh;
            }
        }
    </style>
</head>


<body>
    <header>
        <div class="ロゴ"></div>
        <div id="ヘッダー"></div>
    </header>

    <main>
        <div class="エディタ全体">
            <div class="エディタ側">
                <div class="保存欄">
                    <button type="button" id="フォルダボタン">folder</button>
                    <select id="記事選択"></select>
                    <input type="date" id="日付">
                    <span id="保存の合図"></span>
                </div>
                <textarea id="入力" spellcheck="false" placeholder="1行目はタイトル。2行目にid=著者。あとは本文。"></textarea>
            </div>

            <div class="プレビュー側">
                <div class="横に狭い分類">
                    <div id="プレビュー"></div>
                    <div class="承認欲求">
                        <div class="heart">♥<span class="乱数"></span></div>
                        <div class="up">⤴<span class="乱数"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script async src="https://platform.twitter.com/widgets.js"></script>
    <script type="module">
        import { renderPreview } from "./parser.mjs";

        const 入力 = document.getElementById("入力");
        const プレビュー = document.getElementById("プレビュー");

        function render() {
            プレビュー.innerHTML = renderPreview(入力.value);

            プレビュー.querySelectorAll(".カーソルを").forEach(el => {
                el.setAttribute("tabindex", "0");
                const spans = el.querySelectorAll(":scope > span");
                if (spans.length > 1) {
                    spans[1].classList.add("すると出る");
                }
            });
            if (window.twttr && window.twttr.widgets) {
                window.twttr.widgets.load(プレビュー);
            }
        }

        let timer = null;
        入力.addEventListener("input", () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                render();
                saveArticle();
            }, 2000);
        });

        const 日付 = document.getElementById("日付");
        const 日付キー = "blog-preview-date";
        const 今日 = new Date();
        日付.value = localStorage.getItem(日付キー) ||
            `${今日.getFullYear()}-${String(今日.getMonth() + 1).padStart(2, "0")}-${String(今日.getDate()).padStart(2, "0")}`;
        日付.addEventListener("change", () => {
            if (日付.value) openArticle(`${日付.value}.txt`);
        });

        function folderStore(入れる) {
            const 要求 = indexedDB.open("blog-preview", 1);
            要求.onupgradeneeded = () => 要求.result.createObjectStore("フォルダ");
            return new Promise((resolve) => {
                要求.onsuccess = () => {
                    const 倉庫 = 要求.result
                        .transaction("フォルダ", 入れる ? "readwrite" : "readonly")
                        .objectStore("フォルダ");
                    const 操作 = 入れる ? 倉庫.put(入れる, "blog") : 倉庫.get("blog");
                    操作.onsuccess = () => resolve(操作.result);
                };
            });
        }

        let 保存先 = window.showDirectoryPicker ? await folderStore() : null;

        const 記事選択 = document.getElementById("記事選択");
        const フォルダボタン = document.getElementById("フォルダボタン");
        const 保存の合図 = document.getElementById("保存の合図");
        let 保存できる = false;

        const 未保存キー = "blog-preview-unsaved";
        const 未保存 = JSON.parse(localStorage.getItem(未保存キー) || "{}");
        入力.addEventListener("input", () => {
            未保存[`${日付.value}.txt`] = 入力.value;
            localStorage.setItem(未保存キー, JSON.stringify(未保存));
            保存の合図.textContent = "未保存";
        });
        async function listArticles() {
            const 名前たち = [];
            if (保存できる) {
                for await (const [名前, 中身] of 保存先.entries()) {
                    if (中身.kind === "file" && 名前.endsWith(".txt")) 名前たち.push(名前);
                }
                フォルダボタン.hidden = true;
            }
            const 開いている = `${日付.value}.txt`;
            if (!名前たち.includes(開いている)) 名前たち.push(開いている);
            記事選択.textContent = "";
            for (const 名前 of 名前たち.sort().reverse()) {
                記事選択.append(Object.assign(document.createElement("option"),
                    { value: 名前, textContent: 名前 }));
            }
            記事選択.value = 開いている;
        }

        async function openArticle(名前) {
            const ハンドル = 保存できる ? await 保存先.getFileHandle(名前).catch(() => null) : null;
            入力.value = 未保存[名前] ?? (ハンドル ? await (await ハンドル.getFile()).text() : "");
            保存の合図.textContent = 未保存[名前] === undefined ? "" : "未保存";
            日付.value = 名前.slice(0, 10);
            localStorage.setItem(日付キー, 日付.value);
            await listArticles();
            render();
        }

        async function pickFolder() {
            if (保存先 && (await 保存先.requestPermission({ mode: "readwrite" })) === "granted") return true;
            保存先 = await window.showDirectoryPicker({ id: "blog", mode: "readwrite" }).catch(() => null);
            if (!保存先) return false;
            await folderStore(保存先);
            return true;
        }

        保存できる = 保存先 && (await 保存先.queryPermission({ mode: "readwrite" })) === "granted";
        await openArticle(`${日付.value}.txt`);
        if (!window.showDirectoryPicker) フォルダボタン.hidden = true;
        フォルダボタン.addEventListener("click", async () => {
            if (!(await pickFolder())) return;
            保存できる = true;
            await openArticle(`${日付.value}.txt`);
        });

        記事選択.addEventListener("change", () => openArticle(記事選択.value));

        async function saveArticle() {
            if (!保存できる) return;
            const 名前 = `${日付.value}.txt`;
            const 書き込み = await (await 保存先.getFileHandle(名前, { create: true })).createWritable();
            await 書き込み.write(入力.value.replace(/\r\n|\r|\n/g, "\r\n"));
            await 書き込み.close();
            delete 未保存[名前];
            localStorage.setItem(未保存キー, JSON.stringify(未保存));
            if (記事選択.value !== 名前) await listArticles();
            保存の合図.textContent = `${名前} に保存`;
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>
    <script src="../JS.js"></script>
</body>

</html>
